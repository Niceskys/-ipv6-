name: PowerShell Safety Check

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = $false

          Get-ChildItem -Path scripts -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.Name)"
              $errors | ForEach-Object {
                Write-Host ("Line={0} Col={1} Text=[{2}] Message={3}" -f $_.Extent.StartLineNumber,$_.Extent.StartColumnNumber,$_.Extent.Text,$_.Message)
              }
              $bad = $true
            } else {
              Write-Host "PASS PS5 syntax: $($_.Name)"
            }
          }

          if ($bad) {
            throw 'Windows PowerShell 5.1 syntax validation failed.'
          }

      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = $false

          Get-ChildItem -Path scripts -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $($_.Name)"
              $errors | ForEach-Object { Write-Host $_.Message }
              $bad = $true
            } else {
              Write-Host "PASS PS7 syntax: $($_.Name)"
            }
          }

          if ($bad) {
            throw 'PowerShell 7 syntax validation failed.'
          }

      - name: Test CIDR helpers on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Install.ps1'),
            [ref]$tokens,
            [ref]$errors
          )

          if ($errors.Count -gt 0) {
            throw 'Install.ps1 cannot be parsed for helper tests.'
          }

          $functions = $ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
            $node.Name -in @('Test-IPv6InPrefix','Get-IPv6Prefix64')
          }, $true)

          foreach ($fn in $functions) {
            Invoke-Expression $fn.Extent.Text
          }

          if (-not (Get-Command Test-IPv6InPrefix -ErrorAction SilentlyContinue)) {
            throw 'Test-IPv6InPrefix was not loaded.'
          }

          if (-not (Get-Command Get-IPv6Prefix64 -ErrorAction SilentlyContinue)) {
            throw 'Get-IPv6Prefix64 was not loaded.'
          }

          if (-not (Test-IPv6InPrefix '2001:da8:a012:2bf::1fd' '2001:da8:a012::/48')) {
            throw 'Expected campus /48 match failed.'
          }

          if (-not (Test-IPv6InPrefix '2001:da8:a012:2bf::1fd' '2001:da8:a012:2bf::/64')) {
            throw 'Expected campus /64 match failed.'
          }

          if (Test-IPv6InPrefix '2001:da8:a012:2c0::1' '2001:da8:a012:2bf::/64') {
            throw 'Unexpected /64 match.'
          }

          if (-not (Test-IPv6InPrefix '2406:da18:7f:8100::1' '2406:da18::/32')) {
            throw 'Expected node /32 match failed.'
          }

          if (Test-IPv6InPrefix '2406:da19::1' '2406:da18::/32') {
            throw 'Unexpected node /32 match.'
          }

          $p = Get-IPv6Prefix64 '2001:da8:a012:2bf::1fd'
          if ($p -ne '2001:da8:a012:2bf::/64') {
            throw "Unexpected derived /64: $p"
          }

          Write-Host 'PASS CIDR helper tests.'

      - name: Validate override JavaScript
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --check overrides/campus-ipv6.js

          $source = Get-Content overrides/campus-ipv6.js -Raw -Encoding UTF8
          $test = @'
const assert = (condition, message) => {
  if (!condition) throw new Error(message);
};

const sample = {
  proxies: [
    { name: "[anytls]🇭🇰香港V6-01", server: "hk-v6.example", type: "anytls" },
    { name: "[anytls]🇭🇰香港实验性V4-01", server: "hk-v4.example", type: "anytls" },
    { name: "[anytls]🇯🇵日本V6-01", server: "jp-v6.example", type: "anytls" }
  ],
  dns: {},
  tun: { "route-exclude-address": ["10.0.0.0/8"] },
  "proxy-groups": [
    { name: "Crush Cloud", type: "select", proxies: [] },
    { name: "自动选择", type: "url-test", proxies: [] },
    { name: "故障转移", type: "fallback", proxies: [] },
    { name: "Emby", type: "select", proxies: [] }
  ]
};

const result = main(JSON.parse(JSON.stringify(sample)));
assert(result.proxies.length === 1, "Only one HK V6 proxy should remain");
assert(result.proxies[0].name.includes("香港V6-01"), "HK V6 proxy missing");
assert(result.proxies[0]["ip-version"] === "ipv6", "ip-version must be ipv6");
assert(result.tun["route-exclude-address"].includes("10.0.0.0/8"), "Existing TUN exclude was lost");
assert(result.tun["route-exclude-address"].includes("192.168.100.200/32"), "Campus auth exclude missing");
assert(result.tun["route-exclude-address"].includes("192.168.137.0/24"), "Hotspot exclude missing");

for (const groupName of ["自动选择", "故障转移"]) {
  const group = result["proxy-groups"].find(x => x.name === groupName);
  assert(group.proxies.length === 1, groupName + " should contain only HK V6");
  assert(group.proxies[0].includes("香港V6-01"), groupName + " contains an unexpected proxy");
}

const noHk = JSON.parse(JSON.stringify(sample));
noHk.proxies = noHk.proxies.filter(x => !x.name.includes("香港V6-01"));
const closed = main(noHk);
assert(closed.proxies.length === 0, "Fail-closed must clear proxies");

for (const groupName of ["Crush Cloud", "自动选择", "故障转移", "Emby"]) {
  const group = closed["proxy-groups"].find(x => x.name === groupName);
  assert(group.proxies.length === 1 && group.proxies[0] === "REJECT", groupName + " did not fail closed");
}

console.log("PASS override functional tests");
'@

          $temp = Join-Path $env:RUNNER_TEMP 'override-test.js'
          Set-Content -Path $temp -Value ($source + [Environment]::NewLine + $test) -Encoding UTF8
          node $temp

      - name: Static safety guard
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $parts = Get-ChildItem -Path scripts -File |
            Where-Object { $_.Extension -in @('.ps1','.cmd') } |
            ForEach-Object { Get-Content -Path $_.FullName -Raw }

          $all = [string]::Join([Environment]::NewLine, $parts)

          $checks = @(
            @{ Name = 'Disable IPv6 binding'; Pattern = 'Disable-NetAdapterBinding' },
            @{ Name = 'Registry IPv6 disable'; Pattern = 'DisabledComponents' },
            @{ Name = 'Windows IP reset'; Pattern = 'netsh\s+(interface\s+)?ip\s+reset' },
            @{ Name = 'Winsock reset'; Pattern = 'netsh\s+winsock\s+reset' },
            @{ Name = 'Delete IPv6 default route'; Pattern = 'Remove-NetRoute[^\r\n]*(::/0)' },
            @{ Name = 'Delete IPv4 default route'; Pattern = 'Remove-NetRoute[^\r\n]*(0\.0\.0\.0/0)' },
            @{ Name = 'Hard-coded personal DHCPv6'; Pattern = '2001:da8:a012:2bf::1fd' },
            @{ Name = 'Hard-coded reference ifIndex'; Pattern = '(InterfaceIndex|ifIndex)\s*=\s*5\b' }
          )

          $bad = $false

          foreach ($check in $checks) {
            if ($all -match $check.Pattern) {
              Write-Host "BLOCKED: $($check.Name)"
              $bad = $true
            }
          }

          if ($bad) {
            throw 'Static safety guard failed.'
          }

          Write-Host 'PASS static safety guard.'
